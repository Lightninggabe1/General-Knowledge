{n:"Birthday Problem",c:NUM,w:"classic result, 1930s",l:"In a room of <b>23</b> people it's more likely than not that two share a birthday.",f:"There are 253 possible pairs, not 23 people. The same counting error underpins a lot of misplaced confidence about coincidence."},
{n:"Lindy Effect",c:NUM,w:"Mandelbrot 1982; Taleb 2012",l:"For non-perishables, <b>every year survived predicts another</b>.",f:"A book in print for fifty years will plausibly last another fifty. A book published last week probably won't. Applies to ideas and technologies, never to bodies."},
{n:"Regression to the Mean",c:NUM,w:"Francis Galton, 1886",l:"Extreme results are usually followed by <b>ordinary ones</b>, with no cause required.",f:"Kahneman's instructors 'proved' criticism worked and praise didn't. Both were watching the maths, not the pilots."},
{n:"Law of Small Numbers",c:NUM,w:"Tversky and Kahneman, 1971",l:"We expect <b>tiny samples</b> to look like the whole population.",f:"Small counties top both the highest and lowest cancer-rate lists, for the same boring reason: less data, wilder swings."},
{n:"Base Rate Fallacy",c:NUM,w:"Kahneman and Tversky, 1973",l:"Vivid detail overrides <b>how common something actually is</b>.",f:"A 99%-accurate test for a disease that affects 1 in 10,000 still gives you mostly false positives — and almost nobody's intuition accepts that."}
,{n:"Monty Hall Problem",c:NUM,w:"Steve Selvin, 1975; popularised by Marilyn vos Savant, 1990",l:"After picking a door, <b>switching to the other unopened door</b> doubles your odds of winning.",f:"Based on the game show \"Let's Make a Deal.\" Vos Savant's correct solution provoked outraged letters from mathematicians insisting she was wrong. She wasn't."},
{n:"Gambler's Fallacy",c:NUM,w:"traced to the Monte Carlo Casino incident, 1913",l:"Believing a <b>random streak</b> makes the opposite outcome \"due\" next.",f:"A roulette wheel landed on black 26 times running in Monte Carlo. Gamblers bet ever more heavily on red, certain it had to come up — and lost fortunes. Each spin was still independent."},
{n:"Prosecutor's Fallacy",c:NUM,w:"Thompson and Schumann, 1987",l:"Confusing \"how rare this evidence is if innocent\" with \"<b>how likely innocence is</b> given this evidence.\"",f:"A DNA match with 1-in-a-million odds sounds damning, but in a city of ten million, ten other people match too — a courtroom-relevant distinction that's easy to blur."},
{n:"St. Petersburg Paradox",c:NUM,w:"Daniel Bernoulli, 1738",l:"A coin-flip game with <b>infinite expected value</b> that almost nobody would pay more than a few dollars to play.",f:"Bernoulli used the puzzle to argue that people value money on a diminishing scale — the thousandth dollar means less than the first — not on its raw expected value."},
{n:"Two Envelopes Paradox",c:NUM,w:"recreational mathematics puzzle, mid-20th century",l:"A puzzle where swapping <b>either unopened envelope</b> for the other seems to always be the better bet — which can't both be true.",f:"The trap is subtle enough that professional mathematicians disagree about exactly where the reasoning breaks down."},
{n:"Friendship Paradox",c:NUM,w:"Scott L. Feld, 1991",l:"On average, <b>your friends have more friends</b> than you do.",f:"Not a personal failing — a sampling quirk. Popular people show up in far more people's friend lists, so any random friend is more likely to be one of them."},
{n:"Inspection Paradox",c:NUM,w:"documented in queueing theory, mid-20th century",l:"The bus you're waiting for feels like it's <b>always late</b>, because long gaps between buses catch more waiting passengers than short ones.",f:"A rider arriving at a random moment is statistically more likely to land inside a long interval than a short one, which skews everyone's felt experience of \"typical\" wait time."},
{n:"Will Rogers Phenomenon",c:NUM,w:"named by Alvan Feinstein, 1985",l:"Moving one item from a low-average group to a high-average group can <b>raise both averages</b>, with nothing else changing.",f:"Named for Will Rogers's joke that migrants from Oklahoma raised the average intelligence in both states they left and joined. A real statistical effect in medical staging data, not just a punchline."},
{n:"Multiple Comparisons Problem",c:NUM,w:"formalised through 20th-century statistics",l:"Run <b>enough separate statistical tests</b> and some will look significant by chance alone, even in random data.",f:"Test twenty unrelated hypotheses at the standard 5% threshold and you should expect roughly one false positive — even if nothing real is going on at all."},
{n:"Anscombe's Quartet",c:NUM,w:"Francis Anscombe, 1973",l:"Four wildly different-looking datasets can share the <b>exact same average, variance and correlation</b>.",f:"Anscombe built the quartet specifically to prove that summary statistics can hide a graph's real story completely — plot the data, don't just trust the numbers."},
];

/* ---------- RENDER ---------- */
const grid=document.getElementById("grid"),
      tally=document.getElementById("tally"),
      chipbar=document.getElementById("chips"),
      search=document.getElementById("search"),
      filterbtn=document.getElementById("filterbtn"),
      filterlabel=document.getElementById("filterlabel");
let active="All";

function panel(open){
  chipbar.hidden=!open;
  filterbtn.setAttribute("aria-expanded",String(open));
}
filterbtn.onclick=()=>panel(chipbar.hidden);

function norm(s){return s.replace(/<[^>]*>/g,"").replace(/&amp;/g,"&").replace(/[^a-z0-9]+/gi," ").toLowerCase()}
DATA.forEach(d=>{d._h=norm(d.n+" "+d.c+" "+d.w+" "+d.l+" "+d.f)});

function choose(label,btn){
  active=label;
  [...chipbar.children].forEach(c=>c.setAttribute("aria-pressed","false"));
  btn.setAttribute("aria-pressed","true");
  filterlabel.innerHTML=(label==="All"?"Sections":label);
  panel(false);
  render();
}
function makeChip(label,color,value){
  const b=document.createElement("button");
  b.type="button";b.className="chip";b.setAttribute("aria-pressed",value===active);
  b.innerHTML=(color?'<span class="dot" style="background:'+color+'"></span>':"")+label;
  b.onclick=()=>choose(value,b);
  chipbar.appendChild(b);
  return b;
}
const allChip=makeChip("All sections","","All");
Object.keys(CATS).forEach(k=>makeChip(k,CATS[k],k));

function card(d,i){
  const c=CATS[d.c];
  const b=document.createElement("button");
  b.type="button";b.className="card";b.setAttribute("aria-expanded","false");
  b.style.borderLeftColor=c;
  b.innerHTML=
    '<div class="card-top"><h3>'+d.n+'</h3><span class="tag" style="background:'+c+'">'+d.c+'</span></div>'+
    '<p class="line">'+d.l+'</p>'+
    '<div class="more"><div class="more-in"><h4>In the field</h4><p>'+d.f+'</p><p class="filed">Filed by '+d.w+'</p></div></div>'+
    '<span class="hint">Tap to close ▲</span>';
  b.querySelector(".hint").textContent="Tap for the briefing ▾";
  b.onclick=()=>{
    const open=b.getAttribute("aria-expanded")==="true";
    b.setAttribute("aria-expanded",String(!open));
    b.querySelector(".hint").textContent=open?"Tap for the briefing ▾":"Close ▴";
  };
  return b;
}

function render(){
  const q=norm(search.value.trim());
  const list=DATA.filter(d=>(active==="All"||d.c===active)&&(!q||d._h.includes(q)));
  grid.innerHTML="";
  if(!list.length){
    grid.innerHTML='<div class="empty"><h3>Nothing in the files.</h3><p>Try a shorter word, or pick <b>All sections</b> to search the whole manual.</p></div>';
  } else {
    list.forEach((d,i)=>grid.appendChild(card(d,i)));
  }
  tally.innerHTML="Showing <b>"+list.length+"</b> of "+DATA.length+" files"+(active==="All"?"":" · "+active);
}

search.addEventListener("input",render);
document.getElementById("random").onclick=()=>{
  search.value="";
  choose("All",allChip);
  const i=Math.floor(Math.random()*DATA.length), el=grid.children[i];
  el.scrollIntoView({block:"center"});el.click();el.classList.add("flash");
  setTimeout(()=>el.classList.remove("flash"),1900);
};
render();
</script>
</body>
</html>
